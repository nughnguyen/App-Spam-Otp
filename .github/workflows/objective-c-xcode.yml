name: Xcode - Build and Export IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Default Scheme
        working-directory: xcodeapptesst
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo$scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo "Using default scheme: $default"

      - name: Build App Unsigned
        working-directory: xcodeapptesst
        run: |
          scheme=$(cat default)
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          
          xcodebuild build \
            -scheme "$scheme" \
            -$filetype_parameter "$file_to_build" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Unsigned

      - name: Package to IPA
        working-directory: xcodeapptesst
        run: |
          mkdir -p Payload
          cp -r build/Unsigned/*.app Payload/ 2>/dev/null || cp -r build/Unsigned/*/*.app Payload/
          zip -r App-Spam-OTP.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Spam-OTP-IPA
          path: xcodeapptesst/App-Spam-OTP.ipa
